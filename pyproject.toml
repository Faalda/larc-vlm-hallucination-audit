[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "larc-vlm-hallucination-audit"
version = "1.0.0"
description = "LARC audit tools for internal hallucination probes in vision-language models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "accelerate>=0.30",
  "matplotlib>=3.7",
  "nltk>=3.8",
  "numpy>=1.24",
  "pillow>=10.0",
  "pycocotools>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.1",
  "transformers>=4.49,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
larc_audit = ["data/chair_synonyms.txt"]
